name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets & Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Distribution
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/CapilarFlow.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CapilarFlow-APK
          path: android/app/build/outputs/apk/debug/CapilarFlow.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/CapilarFlow.apk
          name: "CapilarFlow v1.0.0 (APK Android)"
          tag_name: "v1.0.0-apk"
          body: |
            ### 📱 CapilarFlow - Aplicativo Android (APK)
            
            Versão instalável gerada automaticamente via **Capacitor + Android WebView**:
            - Baixe o arquivo `CapilarFlow.apk` abaixo e instale diretamente no seu celular Android.
            - Funciona 100% offline com persistência local de dados.
            - Compatível com Android 7.0+ (API 24+).
          draft: false
          prerelease: false
